# Activates when the repository is pushed to GitHub. Until then run the same commands locally (README.md).
name: course-site
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install -r plan/requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Plan manifest is current
        run: python plan/tools/build_manifest.py --check
      - name: Plan checker
        run: python plan/tools/check_plan.py
      - name: Deck, PDF and plan tests
        working-directory: plan
        env:
          SE_COURSE_SITE: ${{ github.workspace }}/site
        run: pytest -q
      - name: Static-content budget of the cue lists
        if: hashFiles('cues/*.json') != ''
        run: echo "run F:/0_tutorial_videos_project/tools/check_static_content.py cues/*.json on the production machine; the workspace is not available in CI"
      - uses: actions/upload-artifact@v4
        with:
          name: student-pdfs
          path: site/pdf/*.pdf
          if-no-files-found: ignore
