# Runs on every push once the repository has a remote. Until every weekly deck exists, the deck
# and PDF tests are filtered to the decks that are built (the manifest parametrizes all fourteen
# weeks); widen the -k expression as decks are added and drop it when all fourteen exist.
name: course-site
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install -r plan/requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Plan manifest is current
        run: python plan/tools/build_manifest.py --check
      - name: Plan checker
        run: python plan/tools/check_plan.py
      - name: Site fixtures and index are current
        run: |
          python scripts/sync_fixtures.py --check
          python scripts/build_index.py --check
      - name: Deck, PDF and plan tests (built decks only)
        working-directory: plan
        env:
          SE_COURSE_SITE: ${{ github.workspace }}/site
        run: pytest -q -k "test_plan or w01- or w05-dependency-example or w11-latency-is-a-distribution or test_week_pdf_exists_and_reads[1]"
      - name: Cue list matches the deck
        run: python scripts/build_cues.py --week 1 --check
      - name: Static-content budget of the cue lists
        if: hashFiles('cues/*.json') != ''
        run: echo "run F:/0_tutorial_videos_project/tools/check_static_content.py cues/*.json on the production machine; the workspace is not available in CI"
      - uses: actions/upload-artifact@v4
        with:
          name: student-pdfs
          path: site/pdf/*.pdf
          if-no-files-found: ignore
